name: Clear stuck GitHub Pages deployment

on:
  push:
    paths:
      - .github/workflows/clear-stuck-pages-deployment.yml
  workflow_dispatch:

permissions:
  pages: write

jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${{ github.repository }}/pages/deployments/4f00df5357ab40fb46079fdec81922ed3ba8f589/cancel"
